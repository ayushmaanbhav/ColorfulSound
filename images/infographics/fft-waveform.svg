<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="bar-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#ff4400"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <linearGradient id="bar-grad-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffbb00"/>
    </linearGradient>
    <linearGradient id="bar-grad-4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffbb00"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <linearGradient id="bar-grad-5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#88ff00"/>
      <stop offset="100%" stop-color="#00ff00"/>
    </linearGradient>
    <linearGradient id="bar-grad-6" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ff00"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="bar-grad-7" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="bar-grad-8" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="bar-grad-9" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>
    <linearGradient id="bar-grad-10" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0044ff"/>
      <stop offset="100%" stop-color="#4400ff"/>
    </linearGradient>
    <linearGradient id="bar-grad-11" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4400ff"/>
      <stop offset="100%" stop-color="#8800ff"/>
    </linearGradient>
    <linearGradient id="bar-grad-12" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8800ff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#0a0a0f"/>

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <line x1="50" y1="180" x2="550" y2="180"/>
    <line x1="50" y1="140" x2="550" y2="140" stroke-dasharray="5,5"/>
    <line x1="50" y1="100" x2="550" y2="100" stroke-dasharray="5,5"/>
    <line x1="50" y1="60" x2="550" y2="60" stroke-dasharray="5,5"/>
    <line x1="50" y1="20" x2="550" y2="20" stroke-dasharray="5,5"/>
  </g>

  <!-- Frequency Bars -->
  <g filter="url(#glow)">
    <!-- Bar 1 - Red (Bass) -->
    <rect x="60" y="180" width="30" rx="3" fill="url(#bar-grad-1)">
      <animate attributeName="height" values="80;140;100;80" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;40;80;100" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 2 -->
    <rect x="100" y="180" width="30" rx="3" fill="url(#bar-grad-2)">
      <animate attributeName="height" values="60;120;90;60" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;60;90;120" dur="0.7s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 3 -->
    <rect x="140" y="180" width="30" rx="3" fill="url(#bar-grad-3)">
      <animate attributeName="height" values="100;70;130;100" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;110;50;80" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 4 -->
    <rect x="180" y="180" width="30" rx="3" fill="url(#bar-grad-4)">
      <animate attributeName="height" values="120;90;150;120" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;90;30;60" dur="0.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 5 - Green (Mids) -->
    <rect x="220" y="180" width="30" rx="3" fill="url(#bar-grad-5)">
      <animate attributeName="height" values="140;110;80;140" dur="0.75s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;70;100;40" dur="0.75s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 6 -->
    <rect x="260" y="180" width="30" rx="3" fill="url(#bar-grad-6)">
      <animate attributeName="height" values="110;150;100;110" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;30;80;70" dur="0.85s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 7 -->
    <rect x="300" y="180" width="30" rx="3" fill="url(#bar-grad-7)">
      <animate attributeName="height" values="90;60;120;90" dur="0.65s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;120;60;90" dur="0.65s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 8 - Cyan -->
    <rect x="340" y="180" width="30" rx="3" fill="url(#bar-grad-8)">
      <animate attributeName="height" values="70;100;50;70" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;80;130;110" dur="0.55s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 9 -->
    <rect x="380" y="180" width="30" rx="3" fill="url(#bar-grad-9)">
      <animate attributeName="height" values="50;80;40;50" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="130;100;140;130" dur="0.7s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 10 -->
    <rect x="420" y="180" width="30" rx="3" fill="url(#bar-grad-10)">
      <animate attributeName="height" values="60;40;70;60" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;140;110;120" dur="0.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 11 - Purple (Treble) -->
    <rect x="460" y="180" width="30" rx="3" fill="url(#bar-grad-11)">
      <animate attributeName="height" values="40;60;30;40" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;120;150;140" dur="0.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Bar 12 -->
    <rect x="500" y="180" width="30" rx="3" fill="url(#bar-grad-12)">
      <animate attributeName="height" values="30;50;25;30" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;130;155;150" dur="0.45s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Labels -->
  <text x="75" y="195" fill="rgba(255,255,255,0.5)" font-size="8" text-anchor="middle">Bass</text>
  <text x="300" y="195" fill="rgba(255,255,255,0.5)" font-size="8" text-anchor="middle">Mids</text>
  <text x="515" y="195" fill="rgba(255,255,255,0.5)" font-size="8" text-anchor="middle">Treble</text>

  <!-- Title -->
  <text x="300" y="15" fill="#00ffff" font-family="Orbitron, sans-serif" font-size="10" text-anchor="middle" opacity="0.7">FFT FREQUENCY ANALYSIS</text>
</svg>
