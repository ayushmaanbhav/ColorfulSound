name: Bug Report
description: Report a bug or issue with ColorfulSound
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - ayushmaanbhav

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us understand and fix the issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Java Application
        - Arduino Firmware
        - Serial Communication
        - Audio Processing
        - System Tray UI
        - Visualization
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start the application with...
        2. Connect Arduino to...
        3. Play audio and...
        4. See error...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Windows 7/8
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux (Ubuntu/Debian)
        - Linux (Other)
        - Raspberry Pi
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: "Run `java -version` and paste the output"
      placeholder: "e.g., openjdk 11.0.15"
    validations:
      required: true

  - type: input
    id: arduino-board
    attributes:
      label: Arduino Board
      description: Which Arduino board are you using?
      placeholder: "e.g., Arduino Uno R3"

  - type: dropdown
    id: led-type
    attributes:
      label: LED Type
      options:
        - Common Cathode RGB LED
        - Common Anode RGB LED
        - 12V RGB LED Strip
        - WS2812B/NeoPixel
        - Other/Unknown

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Please paste any relevant error messages or console output
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or information about the problem
