<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" fill="none">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="rainbow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="16%" stop-color="#ff8800"/>
      <stop offset="33%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#00ff00"/>
      <stop offset="66%" stop-color="#0088ff"/>
      <stop offset="83%" stop-color="#4400ff"/>
      <stop offset="100%" stop-color="#8800ff"/>
    </linearGradient>

    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="#0a0a0f"/>

  <!-- Step 1: Audio Input -->
  <g transform="translate(50, 40)">
    <rect width="120" height="120" rx="15" fill="rgba(0,255,255,0.1)" stroke="#00ffff" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="60" y="-10" fill="#00ffff" font-family="Orbitron, sans-serif" font-size="12" text-anchor="middle">01</text>

    <!-- Audio Wave Icon -->
    <g transform="translate(60, 60)">
      <line x1="0" y1="-25" x2="0" y2="25" stroke="#00ffff" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y1" values="-25;-15;-25" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="25;15;25" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="-15" y1="-15" x2="-15" y2="15" stroke="#00ffff" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y1" values="-15;-20;-15" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="15;20;15" dur="0.7s" repeatCount="indefinite"/>
      </line>
      <line x1="15" y1="-15" x2="15" y2="15" stroke="#00ffff" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y1" values="-15;-20;-15" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="15;20;15" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-30" y1="-8" x2="-30" y2="8" stroke="#00ffff" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y1" values="-8;-12;-8" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="8;12;8" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="30" y1="-8" x2="30" y2="8" stroke="#00ffff" stroke-width="3" stroke-linecap="round">
        <animate attributeName="y1" values="-8;-12;-8" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="8;12;8" dur="0.9s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="60" y="140" fill="white" font-family="Orbitron, sans-serif" font-size="11" text-anchor="middle">Audio Input</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(180, 95)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#neon-grad)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="1s" repeatCount="indefinite"/>
    </line>
    <polygon points="50,0 40,-5 40,5" fill="#00ffff"/>
  </g>

  <!-- Step 2: FFT Analysis -->
  <g transform="translate(240, 40)">
    <rect width="120" height="120" rx="15" fill="rgba(255,136,0,0.1)" stroke="#ff8800" stroke-width="2"/>
    <text x="60" y="-10" fill="#ff8800" font-family="Orbitron, sans-serif" font-size="12" text-anchor="middle">02</text>

    <!-- FFT Bars -->
    <g transform="translate(25, 90)">
      <rect x="0" width="12" fill="#ff0000" rx="2">
        <animate attributeName="height" values="30;50;30" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-30;-50;-30" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" width="12" fill="#ff8800" rx="2">
        <animate attributeName="height" values="45;25;45" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-45;-25;-45" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" width="12" fill="#ffff00" rx="2">
        <animate attributeName="height" values="55;35;55" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-55;-35;-55" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" width="12" fill="#00ff00" rx="2">
        <animate attributeName="height" values="40;60;40" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-40;-60;-40" dur="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" width="12" fill="#0088ff" rx="2">
        <animate attributeName="height" values="35;20;35" dur="0.55s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-35;-20;-35" dur="0.55s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="60" y="140" fill="white" font-family="Orbitron, sans-serif" font-size="11" text-anchor="middle">FFT Analysis</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(370, 95)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#neon-grad)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="1s" repeatCount="indefinite" begin="0.2s"/>
    </line>
    <polygon points="50,0 40,-5 40,5" fill="#ff00ff"/>
  </g>

  <!-- Step 3: Beat Detection -->
  <g transform="translate(430, 40)">
    <rect width="120" height="120" rx="15" fill="rgba(255,0,255,0.1)" stroke="#ff00ff" stroke-width="2"/>
    <text x="60" y="-10" fill="#ff00ff" font-family="Orbitron, sans-serif" font-size="12" text-anchor="middle">03</text>

    <!-- Heart Beat -->
    <g transform="translate(60, 55)">
      <path d="M0,-15 C-20,-35 -40,-10 0,25 C40,-10 20,-35 0,-15" fill="none" stroke="#ff00ff" stroke-width="2">
        <animate attributeName="transform" values="scale(1);scale(1.2);scale(1)" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <polyline points="-30,10 -15,10 -5,-10 5,20 15,-5 25,10 40,10" fill="none" stroke="#00ffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dashoffset" values="100;0" dur="1s" repeatCount="indefinite"/>
      </polyline>
    </g>

    <text x="60" y="140" fill="white" font-family="Orbitron, sans-serif" font-size="11" text-anchor="middle">Beat Detection</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(560, 95)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#neon-grad)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="1s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <polygon points="50,0 40,-5 40,5" fill="#8b5cf6"/>
  </g>

  <!-- Step 4: Color Mapping -->
  <g transform="translate(620, 40)">
    <rect width="120" height="120" rx="15" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="2"/>
    <text x="60" y="-10" fill="#00ff88" font-family="Orbitron, sans-serif" font-size="12" text-anchor="middle">04</text>

    <!-- Rainbow Spectrum -->
    <rect x="15" y="45" width="90" height="30" rx="5" fill="url(#rainbow-grad)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="95" fill="rgba(255,255,255,0.7)" font-size="9" text-anchor="middle">ROYGBIV</text>

    <text x="60" y="140" fill="white" font-family="Orbitron, sans-serif" font-size="11" text-anchor="middle">Color Mapping</text>
  </g>

  <!-- Arrow 4 -->
  <g transform="translate(750, 95)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#neon-grad)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,60;60,0" dur="1s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <polygon points="50,0 40,-5 40,5" fill="#8b5cf6"/>
  </g>

  <!-- Step 5: RGB Output -->
  <g transform="translate(810, 40)">
    <rect width="120" height="120" rx="15" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="60" y="-10" fill="#8b5cf6" font-family="Orbitron, sans-serif" font-size="12" text-anchor="middle">05</text>

    <!-- RGB Circles -->
    <g transform="translate(60, 55)">
      <circle cx="0" cy="-15" r="18" fill="#ff0000" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-15" cy="12" r="18" fill="#00ff00" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1s" repeatCount="indefinite" begin="0.33s"/>
      </circle>
      <circle cx="15" cy="12" r="18" fill="#0088ff" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1s" repeatCount="indefinite" begin="0.66s"/>
      </circle>
    </g>

    <text x="60" y="140" fill="white" font-family="Orbitron, sans-serif" font-size="11" text-anchor="middle">RGB Output</text>
  </g>
</svg>
